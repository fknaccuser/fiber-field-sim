redHerringPool:
  pick: 1
  from:
    - instanceId: rh-macrobend-a209
      kind: macrobend
      target: { type: fiber-span, spanId: sp-drop-a-209 }
      params: { positionMeters: 20, severity: light }
    - instanceId: rh-fusion-a716
      kind: fusion-splice-degraded
      target: { type: fiber-span, spanId: sp-dist-a-716 }
      params: { positionMeters: 600, lossDb: 0.15 }

referenceSolution:
  rationales:
    - "You establish the reported service failure at the first premise without assuming that an internet complaint means an optical outage."
    - "You compare a customer on another branch. Similar symptoms across branches help you decide whether a shared service needs investigation."
    - "You inspect ONT status across the PON. Compare the physical access state with the application complaint before travelling to the plant."
    - "You inspect the host address, gateway and resolver configuration. You need that baseline before interpreting reachability or name-resolution tests."
    - "You test the local gateway by IP address. This establishes whether the first routing boundary is reachable without involving name resolution."
    - "You test a remote destination by IP address. Compare it with the gateway result to determine whether forwarding extends beyond the local network."
    - "You test the service by hostname. Compare this outcome with the IP-only test to decide whether name resolution needs a separate check."
    - "You query name resolution directly. The response separates resolver behavior from the forwarding path you tested earlier."
    - "You test the configured resolver address from the router. A second vantage point helps distinguish service response from basic reachability."
    - "You cite the observations that separate physical access, forwarding and service behavior. Escalate work outside your authority with a specific, evidence-backed explanation."
  steps:
    - type: customer-contact
      customerId: cust-a-201
    - type: customer-contact
      customerId: cust-b-402
    - type: cli
      endpoint: { kind: device, deviceId: olt-1-dev }
      command: "show ont status"
    - type: cli
      endpoint: { kind: host, hostId: laptop-a-201 }
      command: "ipconfig"
    - type: cli
      endpoint: { kind: host, hostId: laptop-a-201 }
      command: "ping 10.100.0.1"
    - type: cli
      endpoint: { kind: host, hostId: laptop-a-201 }
      command: "ping 203.0.113.10"
    - type: cli
      endpoint: { kind: host, hostId: laptop-a-201 }
      command: "ping portal.isp.net"
    - type: cli
      endpoint: { kind: host, hostId: laptop-a-201 }
      command: "nslookup portal.isp.net"
    - type: cli
      endpoint: { kind: device, deviceId: dist-rtr-1 }
      command: "ping 10.0.0.53"
    - type: diagnosis
      diagnosis:
        claims:
          - faultKind: dns-server-unresponsive
            target: { type: device-global, deviceId: dns-1 }
            evidenceActionIds: ["$7", "$5"]
        escalate:
          reason: "DNS service down on DNS-1; hosts resolve nothing, IP connectivity intact, all ONTs online. Needs NOC/IT."
          evidenceActionIds: ["$2", "$5", "$7", "$8"]
  expectedClaims:
    - faultKind: dns-server-unresponsive
      target: { type: device-global, deviceId: dns-1 }
