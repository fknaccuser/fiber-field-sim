id: t5-everyones-down-nothings-broken
title: Everyone's Down, Nothing's Broken
tier: 5
description: >
  Every customer on two different PON ports reports the internet as dead at
  once, but every ONT is online and every fiber path checks out. The DNS
  server itself is down -- outside a field tech's authority, but recognizing
  that (and escalating instead of rolling a truck) is the whole test.
