    - id: sp-drop-b-305
      fromNodeId: term-b-305
      toNodeId: ont-b-305
      lengthMeters: 71
      events:
        - { id: ev-305-a, kind: connector-apc, positionMeters: 0, lossDb: 0.3, reflectanceDb: -60 }
        - { id: ev-305-b, kind: connector-apc, positionMeters: 71, lossDb: 0.3, reflectanceDb: -60 }
    - id: sp-drop-b-812
