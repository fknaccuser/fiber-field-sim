id: t4-wrong-roll-closure-7
title: Wrong Roll at Closure 7
tier: 4
description: >
  Four customers behind FDH-B are all down at once. A splice tech rolled the
  wrong tube at Closure 7 weeks ago; the paperwork says otherwise.
today: "2026-09-05"
profiles:
  network: xgs-pon-default
  oltVendor: olt-calix-e7-2
  switchVendor: switch-cisco-ios
  hostShell: host-windows
  equipment: hexatronic-commscope-default
  otdrInstrument: otdr-exfo-maxtester-730c
  region: ca-south-oc-digalert
environment:
  weather: overcast
  timeOfDay: "14:10"
truckInventory: [otdr, power-meter, vfl, inspection-scope, launch-cable-500m, laptop, cleaning-kit]
timeBudgetMinutes: 90
startLocationNodeId: yard-1
remoteCliAccess: true
remoteHostAccess: false
travelSeconds:
  default: 900
  pairs:
    - { from: yard-1, to: fdh-b-spl1, seconds: 1200 }
    - { from: fdh-b-spl1, to: cl-7, seconds: 480 }
    - { from: yard-1, to: cl-7, seconds: 1080 }
    - { from: fdh-b-spl1, to: fdh-c-spl1, seconds: 420 }
hints:
  - "What do the four affected addresses have in common? Check the port assignments."

