id: olt-calix-axos-e
kind: olt
displayName: Calix AXOS E-Series (default OLT profile)
promptFormat: "{hostname}>"
commandSet:
  - pattern: "show ont status"
    description: "ONT status per PON port"
  - pattern: "show pon port"
    description: "PON port stats and alarms"
  - pattern: "show interface pon"
    description: "PON interface detail including optical levels"
  - pattern: "show alarms"
    description: "active chassis/line-card/PON alarms"
syntaxErrorTemplate: "% Invalid command."
notes: >
  Seeded as the default OLT vendor profile per team confirmation: the crew said all
  their OLT-side gear "looks similar" and asked for whichever is most common and
  cheapest, guessing Calix. This profile is a placeholder budget-tier XGS-PON OLT
  dialect, not a verified match to a specific chassis/firmware. Fully swappable —
  add a sibling profiles/vendor/olt-*.yaml and repoint activeProfiles.oltVendor to
  correct it later without touching engine code. Full command parsing logic is
  implemented in the CLI/device-state module (build item 3), not here — this file
  only declares which commands this vendor's dialect supports.
